<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nectar of Armenia — Ինքնարժեք</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Armenian:wght@400;600;700&family=Fraunces:wght@600&family=Noto+Serif+Armenian:wght@600&display=swap" rel="stylesheet">
<style>
:root{--g:#1D5545;--g2:#133B30;--gold:#EBA93A;--bg:#F7F3EA;--line:#ECE3CF;--mut:#6B756F;--red:#B03A2E;--ok:#2F7A55}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#1E2A24;font:15px/1.45 Manrope,'Noto Sans Armenian',system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 40px}
html.emb .wrap{padding:0 0 10px;max-width:none}
html.emb .standalone{display:none}
h1,h2{font-family:Fraunces,'Noto Serif Armenian',Lora,serif;font-weight:600;color:var(--g);margin:0}
h1{font-size:26px}h2{font-size:20px}
.sub{color:#5E6A63;font-size:14px;margin:4px 0 0}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 10px 30px rgba(29,85,69,.07);margin-top:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tab{border:1.5px solid #D8CDB4;background:#fff;color:var(--g);border-radius:999px;padding:9px 16px;font:700 14px Manrope,'Noto Sans Armenian',sans-serif;cursor:pointer}
.tab.on{background:var(--g);color:#F6E3B4;border-color:var(--g)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:#7A6A45;text-align:left;padding:10px 8px;border-bottom:1.5px solid #E4DCC8;white-space:normal;font-weight:800;vertical-align:bottom}
td{padding:8px;border-bottom:1px solid #F0E8D6;vertical-align:middle;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:#FBF9F4;font-weight:800;color:var(--g)}
input.n,input.t,select{font:inherit;border:1.5px solid #D8CDB4;border-radius:10px;padding:6px 8px;background:#FFFDF8;color:#1E2A24;min-height:36px}
input.n{width:70px;text-align:right}
input.n.w{width:96px}
input.t{width:100%;min-width:150px}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(235,169,58,.25)}
.pos{color:var(--ok);font-weight:800}.neg{color:var(--red);font-weight:800}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800}
.pill.w{background:#FFF1D6;color:#9A6A00}.pill.r{background:#FBE3E0;color:var(--red)}
.btn{border:0;border-radius:999px;padding:9px 16px;font:800 14px Manrope,'Noto Sans Armenian',sans-serif;cursor:pointer;background:var(--g);color:#F6E3B4}
.btn.l{background:#fff;color:var(--g);border:1.5px solid #D8CDB4}
.btn.gold{background:linear-gradient(180deg,#FCDB82,#EDB040 50%,#D38A22);color:var(--g2)}
.x{width:32px;height:32px;border-radius:999px;border:1px solid #D8CDB4;background:#fff;color:var(--red);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.kpi{padding:12px 14px;border-radius:14px;background:#FBF9F4;border:1px solid var(--line)}
.kpi>span{display:block;font-size:12.5px;color:var(--mut);font-weight:700}
.kpi strong{font-family:Fraunces,Lora,serif;font-size:22px;color:var(--g)}
.note{background:#FFF8EA;border:1px solid #F1D9A6;border-radius:16px;padding:14px 16px;margin-top:16px;font-size:14px}
.note b{color:#8A5A00}
.note ul{margin:6px 0 0;padding-left:20px}.note li{margin:3px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.prodhead{cursor:pointer}.prodhead td:first-child{white-space:normal;min-width:150px}
.prodhead:hover td{background:#FBF9F4}
.chev{display:inline-block;width:18px;color:var(--gold);font-weight:800}
.detail td{background:#FCFAF5;white-space:normal}
.mini{font-size:12.5px;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mut);margin-top:10px}
.save{font-size:12.5px;color:var(--ok);font-weight:700;min-height:18px}

.hero{border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 14px 36px rgba(19,59,48,.12);border:1px solid #E4DCC8}
.hero-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:20px 22px;background:linear-gradient(135deg,#246350 0%,#1D5545 45%,#133B30 100%);position:relative}
.hero-top:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(246,227,180,.10) 1px,transparent 1px);background-size:16px 16px;pointer-events:none}
.hero-id{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.hero-ic{width:52px;height:52px;border-radius:16px;background:#0E2E25;box-shadow:inset 0 0 0 1.5px rgba(235,169,58,.75);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
.hero h1{color:#F7F3EA;font-size:25px}
.hero .sub{color:#BFD6CB;max-width:620px}
.hero-act{display:flex;gap:10px;align-items:center;position:relative;z-index:1}
.hero .save{color:#9FE0B8}
.btn.ghost{background:rgba(255,255,255,.08);color:#F6E3B4;border:1.5px solid rgba(235,169,58,.55)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.tabs{display:flex;gap:8px;padding:12px 16px;background:#F3EBD7;margin:0;overflow-x:auto;border-top:1px solid #E4DCC8}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid #E4DCC8;background:#fff;color:var(--g);font:700 14px Manrope,'Noto Sans Armenian',sans-serif;cursor:pointer;white-space:nowrap}
.tab i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#E8F1EC;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.tab.on{background:var(--g);color:#F6E3B4;border-color:var(--g)}.tab.on i{background:var(--gold)}
.sumk{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.sk{background:#fff;border-radius:18px;padding:14px 16px;border:1px solid #ECE3CF;box-shadow:0 6px 18px rgba(29,85,69,.06);display:flex;gap:12px;align-items:center}
.sk i{font-style:normal;width:42px;height:42px;border-radius:14px;background:#F3EBD7;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.sk>div>span{display:block;font-size:12.5px;color:var(--mut);font-weight:700}
.sk b{font-family:Fraunces,'Noto Serif Armenian',Lora,serif;font-weight:600;font-size:19px;color:var(--g)}
.pcs{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.pc{background:#fff;border-radius:22px;border:1px solid #ECE3CF;box-shadow:0 8px 24px rgba(29,85,69,.07);overflow:hidden}
.pc-top{display:grid;grid-template-columns:minmax(200px,1.1fr) 2fr auto;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid #F0E8D6}
.pc-id{display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0}
.pc-ic{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#FFF6DF,#F6E3B4);box-shadow:inset 0 0 0 1.5px rgba(235,169,58,.55);display:flex;align-items:center;justify-content:center;font-size:25px;flex:0 0 auto}
.pc-id b{display:block;font-family:Fraunces,'Noto Serif Armenian',Lora,serif;font-weight:600;font-size:19px;color:var(--g);line-height:1.2}
.pc-id .mini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}
.pc-cost{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cf{background:#FBF8F1;border:1px solid #F0E8D6;border-radius:14px;padding:7px 10px;display:flex;flex-direction:column;gap:3px}
.cf label{font-size:11.5px;font-weight:800;color:#8A7A55;letter-spacing:.02em}
.cf .ro{font-weight:800;font-size:16px;color:#33403A;min-height:30px;display:flex;align-items:center}
.cf input.n{width:100%;min-height:30px;padding:3px 8px;text-align:left;border-color:#E4DCC8;background:#fff}
.cf.tot{background:#1D5545;border-color:#1D5545}.cf.tot label{color:#BFD6CB}.cf.tot .ro{color:#F6E3B4;font-family:Fraunces,Lora,serif;font-size:19px}
.pc-more{border:1.5px solid #E4DCC8;background:#fff;color:var(--g);border-radius:999px;padding:8px 14px;font:800 13px Manrope,'Noto Sans Armenian',sans-serif;cursor:pointer;white-space:nowrap}
.pc-more:hover,.pc-more.on{background:#F3EBD7;border-color:#EBA93A}
.pc-ch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.ct{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.ct+.ct{border-left:1px solid #F0E8D6}
.ct-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ct-h span{font-size:12.5px;font-weight:800;color:#7A5A12;text-transform:uppercase;letter-spacing:.04em}
.ct-p{display:flex;align-items:center;gap:6px}
.ct-p em{font-style:normal;font-weight:800;color:#8A7A55}
.ct-p input.n{width:90px;font-weight:800;font-size:16px;text-align:left}
.ct-r{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ct-r .big{font-family:Fraunces,'Noto Serif Armenian',Lora,serif;font-size:21px;font-weight:600}
.ct-r .lbl{font-size:12px;color:var(--mut);font-weight:700}
.bar{height:8px;border-radius:99px;background:#F0E8D6;overflow:hidden}.bar>span{display:block;height:100%}.bar i{display:block;height:100%;border-radius:99px;transition:width .25s}
.mp{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.mp.g{background:#E3F2E8;color:#2F7A55}.mp.y{background:#FFF1D6;color:#9A6A00}.mp.r{background:#FBE3E0;color:#B03A2E}
.ct.na{justify-content:center;align-items:center;color:var(--mut);font-size:13px;background:repeating-linear-gradient(135deg,#FBF8F1 0 10px,#F6F0E2 10px 20px)}
.pc-rec{padding:16px 18px 18px;background:#FCFAF5;border-top:1px solid #F0E8D6}
@media (max-width:900px){.pc-top{grid-template-columns:1fr auto}.pc-cost{grid-column:1/-1;grid-row:2}.pc-ch{grid-template-columns:1fr}.ct+.ct{border-left:0;border-top:1px solid #F0E8D6}}
@media (max-width:560px){.pc-cost{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* compact list */
.hero-top{padding:14px 18px}.hero-ic{width:42px;height:42px;font-size:21px;border-radius:13px}.hero h1{font-size:21px}.hero .sub{font-size:13px;margin-top:2px}
.tabs{padding:9px 12px}.tab{min-height:34px;font-size:13.5px}.tab i{width:26px;height:26px;font-size:13px}
.sumk{gap:10px;margin-top:12px}.sk{padding:9px 12px;border-radius:14px;gap:10px;box-shadow:none}.sk i{width:34px;height:34px;font-size:17px;border-radius:11px}.sk b{font-size:16px}
.pl{margin-top:12px;background:#fff;border-radius:20px;border:1px solid #ECE3CF;box-shadow:0 8px 24px rgba(29,85,69,.07);overflow:hidden}
.lg{display:grid;grid-template-columns:minmax(150px,1.2fr) repeat(4,minmax(58px,.6fr)) repeat(3,minmax(96px,1fr)) 30px;gap:8px;align-items:center;padding:8px 14px}
.lh{background:#F3EBD7;border-bottom:1px solid #E4DCC8;font-size:11px;font-weight:800;color:#7A5A12;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.lh .cg{grid-column:2/6;display:flex;justify-content:center;border-bottom:1.5px solid #D9C79C;padding-bottom:3px;color:#1D5545}
.lh .pg{grid-column:6/9;display:flex;justify-content:center;border-bottom:1.5px solid #D9C79C;padding-bottom:3px;color:#1D5545}
.lh .r2{grid-row:2}
.lr{border-bottom:1px solid #F0E8D6;min-height:62px}.lr:hover{background:#FDFBF6}.lr.on{background:#FBF8F1}
.li{display:flex;gap:10px;align-items:center;min-width:0;cursor:pointer}
.li .pc-ic{width:38px;height:38px;border-radius:12px;font-size:19px}
.li b{display:block;font-family:Fraunces,'Noto Serif Armenian',Lora,serif;font-weight:600;font-size:16px;color:var(--g);line-height:1.15}
.li .mini{font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.li .pill{font-size:10.5px;padding:1px 6px}
.lv{font-weight:800;font-size:14px;color:#33403A;font-variant-numeric:tabular-nums}
.lv.tot{background:#1D5545;color:#F6E3B4;border-radius:10px;padding:6px 8px;text-align:center}
.lr input.n{width:100%;min-height:32px;padding:3px 7px;font-size:14px;border-radius:9px}
.lp{display:flex;flex-direction:column;gap:3px}
.lp .pp{display:flex;align-items:center;gap:4px}.lp .pp em{font-style:normal;color:#8A7A55;font-weight:800;font-size:13px}
.lp .pr{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.lp .bar{height:4px}
.lp.na{font-size:11.5px;color:var(--mut);text-align:center}
.tg{width:30px;height:30px;border-radius:50%;border:1.5px solid #E4DCC8;background:#fff;color:var(--g);cursor:pointer;font-weight:800}
.lr.on .tg,.tg:hover{background:#F3EBD7;border-color:#EBA93A}
.lrec{padding:12px 16px 16px;background:#FCFAF5;border-bottom:1px solid #F0E8D6}

.lg{grid-template-columns:minmax(140px,1.15fr) repeat(3,minmax(54px,.5fr)) minmax(84px,.75fr) repeat(4,minmax(84px,1fr)) 30px!important}
.lq-i{display:flex;align-items:center;gap:4px}.per{font-size:11px;color:var(--mut);font-weight:700;white-space:nowrap}
.lv.tot{display:flex;flex-direction:column;gap:1px;text-align:left;padding:5px 8px}.cs{font-size:11px;color:#BFD6CB;font-weight:700;display:flex;justify-content:space-between;gap:6px}.cs b{color:#F6E3B4;font-size:13px}
.lp .pp input.n{min-width:0}

.usw{display:inline-flex;padding:3px;border-radius:999px;background:#F3EBD7;border:1.5px solid #E4DCC8}
.usw button{border:0;background:transparent;color:#1D5545;font:800 13px Manrope,'Noto Sans Armenian',sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer;min-width:44px}
.usw button.on{background:#1D5545;color:#F6E3B4;box-shadow:0 2px 6px rgba(19,59,48,.25)}
.hero .usw{background:rgba(255,255,255,.08);border-color:rgba(235,169,58,.55)}.hero .usw button{color:#F6E3B4}.hero .usw button.on{background:#EBA93A;color:#133B30}

.ipg{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.ipc{background:#fff;border-radius:20px;border:1px solid #ECE3CF;box-shadow:0 8px 24px rgba(29,85,69,.07);overflow:hidden}
.ipc-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 18px;background:#FBF8F1;border-bottom:1px solid #F0E8D6}
.ipc-h>div>b{display:block;font-family:Fraunces,'Noto Serif Armenian',Lora,serif;font-weight:600;font-size:18px;color:var(--g)}
.ipc-h .pc-ic{width:42px;height:42px;font-size:21px;border-radius:13px}
.ipc-s{display:flex;flex-wrap:wrap;gap:6px}
.ipc-b{padding:12px 18px 16px}
.usw button{white-space:nowrap}

.ipc-h>span[data-o]{flex:1 1 100%}
.isw{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.isg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.it{background:#fff;border:1px solid #ECE3CF;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.it span{font-size:11.5px;font-weight:800;color:#8A7A55}.it b{font-size:16px;color:#1E2A24;font-variant-numeric:tabular-nums}
.it.dk{background:linear-gradient(135deg,#246350,#1D5545);border-color:#1D5545}.it.dk span{color:#BFD6CB}.it.dk b{color:#F6E3B4;font-family:Fraunces,Lora,serif;font-size:18px}
.isc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ic{background:#fff;border:1.5px solid #EBDDBA;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ic>span{font-size:11.5px;font-weight:800;color:#7A5A12;text-transform:uppercase;letter-spacing:.04em}
.ic-r{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.ic-r small{font-size:12px;color:var(--mut);font-weight:700}
.ic-r b{font-size:15px;font-variant-numeric:tabular-nums;color:#1E2A24}.ic-r b i{font-style:normal;font-size:11px;color:var(--mut);font-weight:700;margin-left:2px}
.ic-r b.g{color:#2F7A55;font-size:17px}.ic-r b.y{color:#C08410;font-size:17px}.ic-r b.r{color:#B03A2E;font-size:17px}
.ic-m{display:flex;align-items:center;gap:8px}.ic-m .bar{flex:1;height:6px}.ic-m .bar i.g{background:#2F7A55}.ic-m .bar i.y{background:#E0A030}.ic-m .bar i.r{background:#B03A2E}
.ic.na{justify-content:center;align-items:center;text-align:center;background:repeating-linear-gradient(135deg,#FBF8F1 0 10px,#F6F0E2 10px 20px)}.ic.na em{font-style:normal;font-size:12.5px;color:var(--mut)}
@media (max-width:860px){.isg{grid-template-columns:repeat(2,minmax(0,1fr))}.isc{grid-template-columns:repeat(2,minmax(0,1fr))}}

.smt{font-size:13px}
.smt th{font-size:10.5px;padding:7px 6px;vertical-align:bottom}
.smt th.gh{text-align:center;color:#1D5545;background:#F3EBD7;border-bottom:1.5px solid #D9C79C}
.smt td{padding:6px 6px}.smt .mp{font-size:10.5px;padding:0 6px}
.smt .ch{border-left:2px solid #EADFC4}
.smt th.dk,.smt td.dk{background:#EEF5F0}
.smt td.dk b{color:#1D5545}
.smt td.na{text-align:center;color:var(--mut);background:repeating-linear-gradient(135deg,#FBF8F1 0 8px,#F6F0E2 8px 16px)}
.smt tbody tr:nth-child(even) td{background-color:#FCFAF5}.smt tbody tr:nth-child(even) td.dk{background:#E6F0EA}
.smt tbody tr:hover td{background:#FFF8E8}
.sn{display:flex;gap:8px;align-items:center;white-space:nowrap}.sn>span{font-size:18px}.sn b{display:block;color:var(--g);font-size:13.5px}.sn small{color:var(--mut);font-size:11px}
.ptg{color:#2F7A55}.pty{color:#C08410}.ptr{color:#B03A2E}
@media print{body{background:#fff}.hero,.legend .btn{display:none}.card{box-shadow:none}.smt{font-size:10px}}

.bagf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:14px}
.bf{display:flex;flex-direction:column;gap:4px;background:#FBF8F1;border:1px solid #ECE3CF;border-radius:14px;padding:10px 12px}
.bf label{font-size:12px;font-weight:800;color:#8A7A55}.bf input.n{width:130px;font-size:17px;font-weight:800;text-align:left}
.bf.res{background:linear-gradient(135deg,#246350,#1D5545);border-color:#1D5545;min-width:170px}.bf.res label{color:#BFD6CB}.bf.res b{font-family:Fraunces,Lora,serif;font-size:26px;color:#F6E3B4;line-height:1.1}.bf.res small{color:#BFD6CB;font-size:11.5px}
.op{font-size:22px;font-weight:800;color:#C9B78E;padding-bottom:14px}
tr.off td{opacity:.55}
.sw{position:relative;display:inline-block;width:42px;height:24px;vertical-align:middle}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:#D8CDB4;transition:.2s;cursor:pointer}.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:#1D5545}.sw input:checked+span:before{transform:translateX(18px)}
.bagv{display:flex;flex-direction:column;font-weight:800;font-size:14px;color:#33403A}.bagv small{font-size:10.5px;color:#8A7A55;font-weight:700}
.smt td.dk,.scroll td.dk{background:#EEF5F0}
