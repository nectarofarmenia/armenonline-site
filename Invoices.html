function nextNo(ck){var mx=0;DB.list.forEach(function(v){if(v.ck===ck){var k=parseInt(String(v.no).replace(/\D/g,"").slice(-4),10)||0;if(k>mx){mx=k;}}});return {n:mx+1,no:fmtNo(mx+1)};}
function renumber(){var G={};DB.list.forEach(function(v){(G[v.ck]=G[v.ck]||[]).push(v);});Object.keys(G).forEach(function(k){G[k].sort(function(a,b){return String(a.d).localeCompare(String(b.d))||String(a.created||"").localeCompare(String(b.created||""));}).forEach(function(v,i){v.no=fmtNo(i+1);});});DB.num2=1;}
function byId(id){return DB.list.filter(function(v){return v.id===id;})[0];}
function logAdd(v,t){(v.log=v.log||[]).push([new Date().toISOString(),t]);}

function servedNoInv(){var used={};DB.list.forEach(function(x){(x.ord||[]).forEach(function(o){used[o]=1;});});var td=today();
  return (CS.calls||[]).filter(function(c){var d=String(c.ddate||c.date||"");return c.id&&!used[c.id]&&c.name&&d&&d<=td&&(c.lines||[]).length;});}
function genFromOrders(){var L=servedNoInv().slice().sort(function(a,b){return String(a.ddate||a.date).localeCompare(String(b.ddate||b.date));});var P=CS.prod||[];var prof=CS.cprof||{};var n=0;
  L.forEach(function(o){var t=o.type==="w"?"w":"r";var ck=ckey(o.name,t);var pf=prof[ck]||{};var d=String(o.ddate||o.date).slice(0,10);
    var lines=[];(o.lines||[]).forEach(function(l){var p=P[+l[0]];if(!p){return;}var u=+l[1]===1?1:0;lines.push({pid:p.id,desc:pName(p.id,"en"),u:u,pp:+p.packPcs||10,q:+l[2]||0,pr:l[3]!=null?+l[3]:priceFor(p.id,u,t),un:"",ord:o.id});});
    if(!lines.length){return;}var terms=t==="w"?7:0;
    var v={id:"inv"+Date.now().toString(36)+n,no:"",ck:ck,c:{n:o.name,t:t,a:pf.addr||o.addr||"",e:pf.email||o.email||"",p:pf.phone||o.phone||""},d:d,du:addDays(d,terms),terms:terms,lang:"en",pt:t,lines:lines,disc:0,tax:0,ship:0,note:"",st:o.paid?"paid":"sent",ord:[o.id],created:new Date().toISOString(),auto:1,log:[[new Date().toISOString(),"Ստեղծվեց պատվերից ("+(o.book?"վաճառքի գիրք":"հեռախոսային պատվեր")+")"]]};
    if(o.paid){var tt=tots(v).tot;v.paid={d:d,m:PMN[o.pay]||"",amt:tt};}
    DB.list.push(v);n++;});
  if(DB.num2){DB.list.filter(function(v){return v.auto&&!v.no;}).sort(function(a,b){return String(a.d).localeCompare(String(b.d));}).forEach(function(v){v.no=nextNo(v.ck).no;});}else{renumber();}DB.autoImp=1;saveDB();return n;}
